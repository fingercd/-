schema_version: 1

dataset:
  name: ucf_crime
  root: data/raw/ucf_crime
  train_manifest: data/manifests/ucf_crime/train.jsonl
  test_manifest: data/manifests/ucf_crime/test.jsonl

sampler:
  kind: uniform_segments
  segments_per_video: 32
  clip_frames: 16
  frame_stride: 2

encoder:
  adapter: videomaev2
  model: OpenGVLab/VideoMAEv2-Base
  checkpoint: videomaev2-base-hf
  trainable: false
  precision: fp16

streaming:
  enabled: false

task:
  kind: weak_mil
  supervision: video
  pooling: attention
  top_k: 3

output:
  root: outputs
  run_name: ucf-videomaev2-weak

