  checkout_path: external/longvu
  model_path: weights/longvu
  runtime: external_python
  device: cuda
  prompt: Describe the visible video content, actions, objects, and temporal changes
    without assuming any event label.
  feature_stage: projected_visual
  cache_mode: false
  strict_assets: true
  upstream_entrypoint: longvu/builder.py:load_pretrained_model
  preprocess_profile: longvu-bthwc-v1
checkpoint:
