  model_id: Vision-CAIR/LongVU_Qwen2_7B
  revision: 1b0be5cc28614b03a423bbaf129ae364750b5012
  license: apache-2.0
  local_path: weights/longvu
input_profile:
  clip_frames: 32
  frame_stride: 2
  image_size: 336
  sampling: uniform
output:
