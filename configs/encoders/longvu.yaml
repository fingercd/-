  supports_training: false
  fixed_num_frames: null
  min_frames: 1
  max_frames: null
cache_semantics:
  kind: vision_tokens
  compression: disabled
  prompt_policy: fixed_category_independent
upstream_lock: integrations/longvu/upstream.lock.yaml
