schema_version: 1
name: streaming-vlm
adapter: streaming_vlm
family: streaming_vlm
constructor:
  model_name: mit-han-lab/StreamingVLM
  checkout_path: external/streaming-vlm
  model_path: weights/streaming-vlm
  runtime: external_python
  device: cuda
  prompt: Describe the visible video content, actions, objects, and temporal changes
    without assuming any event label.
  feature_stage: decoder_contextual
  cache_mode: identity
  streaming: true
  chunk_frames: 4
  strict_assets: true
  upstream_entrypoint: streaming_vlm/inference/inference.py:load_model
  preprocess_profile: streaming-vlm-bthwc-v1
checkpoint:
  source: huggingface
  model_id: mit-han-lab/StreamingVLM
  revision: a940d8cbfa14eefe651b7f4adeb81825c28cc6c6
  license: mit
  local_path: weights/streaming-vlm
input_profile:
  clip_frames: 4
  frame_stride: 2
  image_size: 448
  sampling: streaming_uniform
output:
  feature_stage: decoder_contextual
  sequence_source: decoder_hidden_state
  implementation_source: external_worker_facade
capabilities:
  supports_fixed_clip: false
  supports_streaming: true
  supports_kv_cache: true
  supports_token_cache: false
  supports_visual_memory_cache: false
  supports_external_cache_policy: false
  supports_training: false
  fixed_num_frames: null
  min_frames: 1
  max_frames: null
cache_semantics:
  kind: decoder_kv
  compression: disabled
  owner: language_model_decoder
  prompt_policy: fixed_category_independent
upstream_lock: integrations/streaming_vlm/upstream.lock.yaml
