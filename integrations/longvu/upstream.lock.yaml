integration_notes:
  - LongVU 是视频 VLM；本 adapter 导出 projected_visual 表征，而不是生成文本。
  - 真实 checkpoint 与上游 checkout 必须由服务器上的显式资产步骤准备。
  - 本接入固定类别无关 prompt，不启用或比较任何 KV/token 压缩策略。
